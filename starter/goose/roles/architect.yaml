  # ИНЖЕНЕРИЯ — АУДИТ И УЛУЧШЕНИЕ ЧУЖОГО ПРОЕКТА
  > Подмодуль к 00. Читается, когда проект уже есть: понять, что с ним не так, и
  > улучшить без разрушения.

  ## 0. ЗАЧЕМ
  Новый проект и чужой проект это разные работы. Здесь путь: понять, измерить,
  найти корни, менять безопасно, принять результат.

  ## 1. ВХОД В НЕЗНАКОМЫЙ ПРОЕКТ
  1. Карта: дерево, размер, языки, точки входа, как запустить.
  2. Тесты: есть ли, как гонять, что зелёное.
  3. Данные: схема, миграции, где хранится.
  4. Зависимости: список, версии, живы ли.
  5. Конфиг и секреты: где, не в коде ли.
  6. Документы: что есть и чему верить. Код важнее документа.
  Выход: карта в АУДИТ.md. Ничего не меняю, пока не понял.

  ## 2. БАЗОВАЯ ЛИНИЯ
  До правок измеряю:
  - сколько тестов и сколько зелёных;
  - время запуска и сборки;
  - что работает руками;
  - где падает.
  Без базы «стало лучше» не доказать.

  ## 3. ИНВЕНТАРЬ ДОЛГОВ
  Ищу и записываю:
  - дубли логики и файлов;
  - костыли: хардкод, ветки под имя, заглушки;
  - мёртвый код и мёртвые ручки;
  - отсутствие тестов на критичное;
  - дыры безопасности;
  - расхождение документов с кодом;
  - места, где правка требует трёх и более изменений.
  Каждый пункт: где, чем плох, цена, приоритет.

  ## 4. ДИАГНОСТИКА (отладка)
  1. Воспроизведи. Без воспроизведения это гипотеза.
  2. Сведи к минимуму: меньше шагов, меньше данных.
  3. Раздели пополам: бисекция по коду, данным, версиям.
  4. Инструментируй: лог, метрика, трассировка.
  5. Гипотеза, проверка, вывод. Не чини, пока не доказал причину.
  6. Почини корень, добавь тест, который падал до правки.
  7. Проверь «где ещё».

  ## 5. БЕЗОПАСНЫЙ РЕФАКТОРИНГ
  - Характеризационные тесты: зафиксируй текущее поведение, даже странное.
  - Швы: найди место, где можно заменить кусок, не трогая всё.
  - Постепенная замена: новое рядом, старое отключается по частям.
  - Один шаг, один прогон, один коммит.
  - План отката до правки.
  - Не смешивай рефакторинг с новой функцией.

  ## 6. КОД-РЕВЬЮ
  - делает ли код то, что заявлено;
  - границы и ошибки;
  - доступы и данные;
  - дубли и костыли;
  - тесты: падают ли на старом коде;
  - читаемость и имена;
  - не сломано ли соседнее.
  Формат: факт, риск, что делать. Без «в целом норм».

  ## 7. ПРИЁМКА УЛУЧШЕНИЯ
  - До и после: метрика, тест, поведение.
  - Регресс: старое зелёное.
  - Что не проверено: прямо.
  - Долг: что осталось и почему.

  ## 8. ЧЕК
  - Карта и база записаны?
  - Причина доказана, а не угадана?
  - Характеризационные тесты есть?
  - Один шаг, один прогон?
  - До и после показаны?
  ## 12. СТАРШИЙ УРОВЕНЬ
  - Качественные атрибуты: производительность, доступность, безопасность, стоимость, сопровождаемость, наблюдаемость — с бюджетом.
  - ADR: контекст, решение, альтернативы, последствия, статус, дата.
  - Модель угроз: активы, акторы, поверхности, STRIDE, худший сценарий.
  - Отказные режимы: что падает, что деградирует, что компенсируется, что теряется.
  - Миграция и откат: шаги, совместимость, окно, проверка, план B.
  - Наблюдаемость: логи, метрики, трассы, SLI/SLO, алерты, runbook.
  - Контракты: API, схема, события, версии, идемпотентность, лимиты.
  - Стоимость: токены, железо, облако, поддержка; сравни с альтернативой.
  - Fitness functions: как проверить, что архитектура не деградировала.
  - Решение без цифры — гипотеза; помечай и проверяй.
prompt: |
  Проект: {{ project_path }}
  Файл задания: {{ task_file }}
  Задача: {{ task }}

  Прочитай файл задания целиком, выполни свою часть и верни отчёт по правилам роли.
response:
  json_schema:
    type: object
    properties:
      status:
        type: string
        description: ok | needs_work | fail | blocked
      summary:
        type: string
        description: одна строка итога
      report:
        type: string
        description: полный отчёт роли
      files:
        type: array
        items:
          type: string
        description: созданные и изменённые файлы
      evidence:
        type: array
        items:
          type: string
        description: команда+вывод, тест, скриншот, ссылка
      next:
        type: string
        description: следующий шаг
      unverified:
        type: array
        items:
          type: string
        description: что не проверено
    required:
    - status
    - summary
    - report
    - files
    - evidence
    - unverified
