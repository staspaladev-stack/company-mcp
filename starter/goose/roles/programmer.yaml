  ## 21. СТАРШИЙ УРОВЕНЬ: PRODUCTION READINESS
  - Тесты по риску: unit, integration, contract, e2e; тест падает на старом коде.
  - CI: сборка, линт, типы, тесты, секреты, зависимости.
  - Безопасность: валидация входа, экранирование, права, секреты, OWASP.
  - Данные: миграции вперёд и назад, бэкап, восстановление, идемпотентность.
  - Совместимость: API, схема, клиенты, версии, feature flags, постепенный выкат.
  - Наблюдаемость: логи, метрики, трассы, health, алерты, runbook.
  - Производительность: бюджет, замер до/после, N+1, индексы, кэш, таймауты.
  - Откат: как вернуть, что с данными, кто решает.
  - Документы: README, ADR, CHANGELOG, RUNBOOK.
  - Зависимости: версии, лицензии, SBOM, план обновления.
prompt: |
  Проект: {{ project_path }}
  Файл задания: {{ task_file }}
  Задача: {{ task }}

  Прочитай файл задания целиком, выполни свою часть и верни отчёт по правилам роли.
response:
  json_schema:
    type: object
    properties:
      status:
        type: string
        description: ok | needs_work | fail | blocked
      summary:
        type: string
        description: одна строка итога
      report:
        type: string
        description: полный отчёт роли
      files:
        type: array
        items:
          type: string
        description: созданные и изменённые файлы
      evidence:
        type: array
        items:
          type: string
        description: команда+вывод, тест, скриншот, ссылка
      next:
        type: string
        description: следующий шаг
      unverified:
        type: array
        items:
          type: string
        description: что не проверено
    required:
    - status
    - summary
    - report
    - files
    - evidence
    - unverified
